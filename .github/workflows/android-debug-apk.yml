name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Test and assemble debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-debug' }}
          RELEASE_TITLE: ${{ startsWith(github.ref, 'refs/tags/') && format('AI News Android {0}', github.ref_name) || 'AI News Android latest debug APK' }}
        run: |
          if [[ "$RELEASE_TAG" == "latest-debug" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$RELEASE_TAG"
          fi

          NOTES="Debug APK built by GitHub Actions from ${GITHUB_SHA}."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --prerelease \
              --notes "$NOTES"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --prerelease
          gh release upload "$RELEASE_TAG" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
